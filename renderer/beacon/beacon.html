<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { background: transparent; overflow: hidden; width: 100%; height: 100%; }
#beacon {
  /* solid widget: 97% opaque dark pill — always hittable on Windows */
  width: 64px; height: 26px;
  margin: 8px auto 0;
  position: relative;
  border-radius: 13px;
  background: rgba(38, 38, 46, 0.97);
  border: 1px solid rgba(255, 170, 60, 0.35);
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
  display: flex; align-items: center; justify-content: center;
  gap: 6px;
  cursor: pointer;
  /* R165: 宽度零过渡——宽度动画期间 flex 子元素被挤压变形（用户实测）。label 淡入承担动效 */
  overflow: hidden;
}
#beacon .label {
  font-size: 11px; font-weight: 700; color: rgba(255, 232, 190, 1);
  white-space: nowrap; opacity: 0; width: 0; overflow: hidden;
  transition: opacity 140ms ease, transform 140ms ease;
  transform: translateX(-6px);
}
@media (prefers-color-scheme: dark) {
  #beacon .label { color: rgba(255, 225, 180, 1); }
  #beacon { background: rgba(24, 24, 30, 0.97); border-color: rgba(255, 170, 60, 0.5); }
}
#beacon::after {
  /* +8px hit ring: fixed pseudo escapes the pill's overflow:hidden clip and
     covers the whole window; 1% alpha keeps it hittable on Windows */
  content: ''; position: fixed; inset: 0;
  background: rgba(0, 0, 0, 0.01);
}
#beacon:hover { width: 118px; }
#beacon:hover .label { opacity: 1; transform: translateX(0); transition: opacity 160ms ease 80ms, transform 160ms ease 80ms; }

.sun {
  width: 15px; height: 15px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #ffe9a8, #ffb14a 60%, #ff8f1f);
  /* static glow: zero repaints while idle (animations here stuttered the desktop) */
  box-shadow: 0 0 7px 2px rgba(255, 160, 50, 0.75);
  display: flex; align-items: center; justify-content: center;
  transition: transform 160ms cubic-bezier(0.26, 1.4, 0.48, 1);
}
#beacon:hover .sun { transform: scale(1.3); box-shadow: 0 0 12px 4px rgba(255, 170, 60, 0.95); }
.rays { display: none; }
/* time-of-day hue — one class per load from beacon.js; static shadow (no
   idle animation: prior rounds found glow animations stuttered the desktop) */
body.dawn  .sun { background: radial-gradient(circle at 35% 35%, #ffe7ef, #ffbf8a 60%, #ff8d7a); box-shadow: 0 0 7px 2px rgba(255, 165, 135, 0.75); }
body.day   .sun { background: radial-gradient(circle at 35% 35%, #ffe9a8, #ffb14a 60%, #ff8f1f); box-shadow: 0 0 7px 2px rgba(255, 160, 50, 0.75); }
body.dusk  .sun { background: radial-gradient(circle at 35% 35%, #ffd9a3, #ff8a3d 60%, #ff5722); box-shadow: 0 0 8px 2px rgba(255, 110, 50, 0.80); }
body.night .sun { background: radial-gradient(circle at 35% 35%, #eef4ff, #b4c8e6 60%, #8aa6d6); box-shadow: 0 0 7px 2px rgba(170, 200, 255, 0.70); }
@media (prefers-color-scheme: dark) {
  #beacon { background: rgba(20, 20, 26, 0.97); border-color: rgba(255, 170, 60, 0.55); }
}
body.power-save .sun { transform: none !important; }
body.power-save .rays { display: none !important; }
</style>
</head>
<body>
  <div id="beacon" title="SunMemo · 点击展开晾衣绳" role="button" aria-label="展开晾衣绳">
    <div class="rays" style="display:none"></div>
    <div class="sun">☀️</div>
    <span class="label">晾衣绳</span>
  </div>
  <script src="beacon.js"></script>
</body>
</html>
